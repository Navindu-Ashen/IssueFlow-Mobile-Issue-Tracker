name: issueflow
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.4.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.4.0
  intl: ^0.19.0
  json_annotation: ^4.8.1
  google_fonts: ^8.1.0
  flutter_native_splash: ^2.4.6
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_native_splash:
  color: "#f3e6fe"
  image: assets/splash_icon.png
  color_dark: "#120022"
  image_dark: assets/splash_icon.png
  android_12:
    color: "#f3e6fe"
    image: assets/splash_icon.png
    icon_background_color: "#f3e6fe"
    color_dark: "#120022"
    image_dark: assets/splash_icon.png
    icon_background_color_dark: "#120022"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ic_launcher.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/ic_launcher_monochrome.png"
